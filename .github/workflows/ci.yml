name: CI

on:
  push:
    branches: 
      - feat/github-action-practice

jobs:
  unit-test-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"
          cache-dependency-path: bugtracker-backend/go.sum

      - name: Execute Backend Unit Test
        working-directory: ./bugtracker-backend
        run: |
          go test -v ./...

  unit-test-frontend:
    needs: unit-test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache-dependency-path: bugtracker-frontend/package-lock.json

      - name: Execute FrontEnd Unit Test
        working-directory: ./bugtracker-frontend
        run: |
          npm ci
          npm test